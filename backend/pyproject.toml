[project]
name = "healthrev-backend"
version = "0.0.1"
description = "Chronic Health Tracker — backend API (M0 foundation)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyjwt>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# B008: FastAPI's `Depends(...)` in argument defaults is the documented idiom.
# UP042: `class X(str, Enum)` serialises cleanly with Pydantic/FastAPI; keep it.
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
# demo.py embeds a single-file HTML page (inline CSS/JS); don't reflow string lines.
"app/routers/demo.py" = ["E501"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
